services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 portfolio_site.wsgi:application
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=portfolio_site.settings.production
      - SECRET_KEY=production-secret-key-change-in-env
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DATABASE_URL=postgres://portfolio_user:portfolio_password@db:5432/portfolio_db
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=portfolio_db
      - POSTGRES_USER=portfolio_user
      - POSTGRES_PASSWORD=portfolio_password

volumes:
  postgres_data:
  static_volume:
  media_volume:
